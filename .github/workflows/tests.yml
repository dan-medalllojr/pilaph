name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # Same credentials as .env.example / docker-compose.yml.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pilaph
          POSTGRES_USER: pilaph
          POSTGRES_PASSWORD: pilaph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pilaph -d pilaph"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Create test database
        run: PGPASSWORD=pilaph psql -h 127.0.0.1 -U pilaph -d pilaph -c 'CREATE DATABASE pilaph_test'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
