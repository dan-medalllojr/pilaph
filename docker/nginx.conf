# nginx in front of PHP-FPM. __PORT__ is replaced at container start with
# $PORT (set by Railway; 8080 when unset). See docker/start.sh.
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Shop photos and other uploads.
    client_max_body_size 8m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    server {
        listen __PORT__ default_server;
        listen [::]:__PORT__ default_server;
        root /app/public;
        index index.php;

        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Hashed Vite assets never change, so browsers can cache them for a year.
        location /build/assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # nginx's mime.types doesn't know .webmanifest (installable owner app).
        location = /manifest.webmanifest {
            default_type application/manifest+json;
            try_files $uri =404;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_hide_header X-Powered-By;
            # Laravel's Link headers preload every script by its full URL. On a
            # long domain they outgrow nginx's default 4 KB header buffer, and
            # the login page (the most scripts) failed with 502.
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 16k;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
