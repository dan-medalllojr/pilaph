; PHP-FPM workers: how many requests PHP handles at once (PHP's own default
; is only 5, so a few slow requests, such as a payment talking to HitPay,
; made everyone else wait).
;
; Each worker can hold a database connection while it runs, and so can the
; queue worker and the scheduler. Keep PHP_FPM_MAX_CHILDREN + 2 at or below
; Supabase's pooler "Pool Size" (Database > Connection pooling), and at least 6.
; Change it with the PHP_FPM_MAX_CHILDREN variable; no rebuild needed.
[www]
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Recycle each worker now and then, so memory never creeps up.
pm.max_requests = 500
